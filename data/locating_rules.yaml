# 缺陷定位规则：测试名关键词 -> 疑似原因 + 风险等级
# 报告按接口+疑似原因聚类，规则写在这里，改规则不改代码
rules:
  - match: "test_d1"
    cause: "鉴权缺失：管理接口未接登录校验"
    risk: "高"
    defect: "D1"
  - match: "test_d2"
    cause: "越权 IDOR：只校验登录，未校验资源归属"
    risk: "高"
    defect: "D2"
  - match: "test_d3"
    cause: "参数校验缺失：非法数量未拦截，触发服务端 500"
    risk: "中"
    defect: "D3"
  - match: "test_d4"
    cause: "注入防护缺失：查询参数未过滤，返回全量数据"
    risk: "高"
    defect: "D4"
  - match: "test_d5"
    cause: "慢接口：响应时间超过阈值"
    risk: "低"
    defect: "D5"
  - match: "test_d6"
    cause: "提示注入未拦截：系统提示被泄露"
    risk: "高"
    defect: "D6"
default:
  cause: "未归类失败，需人工看日志"
  risk: "中"
  defect: "-"
